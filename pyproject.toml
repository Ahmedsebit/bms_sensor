[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wallinde-sensor-service"
version = "0.2.0"
description = "Wallinde authenticated sensor ingress, durable journal and test sender"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
wallinde-sensors = "wallinde_sensor.service:main"
wallinde-sensor-send = "wallinde_sensor.sender:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wallinde_sensor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["wallinde_sensor"]
